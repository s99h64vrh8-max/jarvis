body.th-natt{--bg:#030305;--bg2:#0b0a10;--acc:#ff9b5a;--acc2:#b0563a;--acct:#ffc9a3;--txt:#f3e6dc;--dim:#cdbcb0;--line:rgba(255,155,90,.22);--glass:rgba(14,11,16,.8);--glow:rgba(255,140,80,.28)}
body.th-smaragd{--bg:#020c08;--bg2:#06180f;--acc:#38f5a8;--acc2:#1fb37a;--acct:#b8ffdc;--txt:#ecfff6;--dim:#b9dccb;--line:rgba(56,245,168,.27);--glass:rgba(5,24,15,.74);--glow:rgba(56,245,168,.42)}
body.th-kvarts{--bg:#08050f;--bg2:#140c22;--acc:#c48bff;--acc2:#ff7ad9;--acct:#e8d2ff;--txt:#f8f0ff;--dim:#d6c6e6;--line:rgba(196,139,255,.3);--glass:rgba(20,12,34,.74);--glow:rgba(196,139,255,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--fb);font-weight:500;font-size:17px;line-height:1.35;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
svg:where([aria-hidden]){width:20px;height:20px;flex:0 0 auto}
.li>svg{width:18px;height:18px;color:var(--dim)}
body{background:radial-gradient(1200px 800px at 50% 40%,var(--bg2),var(--bg) 70%);transition:background .6s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--line)}
select option{background:#000;color:#fff}
h1,h2,h3,h4{margin:0;font-weight:600}
a{color:var(--acct)}
.hide{display:none!important}
#bg{position:fixed;inset:0;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.vign{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.scan{position:fixed;left:0;right:0;top:0;height:140px;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0),var(--line),rgba(0,0,0,0));opacity:.25;-webkit-animation:scan 9s linear infinite;animation:scan 9s linear infinite}
@-webkit-keyframes scan{from{-webkit-transform:translateY(-160px)}to{-webkit-transform:translateY(110vh)}}
@keyframes scan{from{transform:translateY(-160px)}to{transform:translateY(110vh)}}
/* --- ramverk --- */
#app{position:fixed;left:0;top:0;right:0;bottom:0;z-index:2;display:-webkit-box;display:flex}
#rail{width:86px;flex:0 0 86px;display:flex;flex-direction:column;align-items:center;padding:calc(14px + var(--safeT)) 0 14px;gap:6px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15))}
.logo{width:46px;height:46px;margin-bottom:10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:20px;color:var(--acct);border:1px solid var(--line);box-shadow:0 0 18px var(--glow),inset 0 0 12px var(--glow)}
.nb{width:72px;padding:9px 0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:12.5px;font-weight:600;letter-spacing:.04em;position:relative;transition:color .2s,background .2s}
.nb svg{width:26px;height:26px}
.nb.on{color:var(--acct);background:rgba(255,255,255,.05)}
.nb.on:before{content:'';position:absolute;left:-7px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.nb:active{transform:scale(.95)}
.rail-sp{flex:1}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#top{display:flex;align-items:center;gap:14px;padding:calc(12px + var(--safeT)) 22px 8px;min-height:62px}
#top .clk{font-family:var(--fd);font-size:28px;letter-spacing:.06em;color:var(--txt);text-shadow:0 0 18px var(--glow)}
#top .dt{color:var(--dim);font-size:16px;line-height:1.15}
#top .dt b{color:var(--txt);font-weight:600;display:block}
.top-sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--txt);font-size:14.5px;font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.off i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.ibtn{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(0,0,0,.45);color:var(--acct)}
.ibtn svg{width:22px;height:22px}
#stage{flex:1;position:relative;min-height:0}
.mode{position:absolute;left:0;top:0;right:0;bottom:0;opacity:0;visibility:hidden;transform:scale(.965);transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s .6s;overflow:auto;-webkit-overflow-scrolling:touch}
body:not(.lite) .mode{filter:blur(6px);transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1),filter .55s,visibility 0s .6s}
.mode.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
body:not(.lite) .mode.on{filter:none}
#cmd{display:flex;gap:10px;padding:10px 22px calc(14px + var(--safeB));align-items:center}
#cmd input{flex:1;font-size:18px;padding:13px 16px;border-radius:14px;background:rgba(0,0,0,.6)}
.mic{width:52px;height:52px;flex:0 0 52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--bg);background:var(--acc);box-shadow:0 0 20px var(--glow)}
.mic svg{width:24px;height:24px}
.mic.on{-webkit-animation:pulse 1s infinite;animation:pulse 1s infinite}
@-webkit-keyframes pulse{50%{box-shadow:0 0 0 12px rgba(0,0,0,0),0 0 34px var(--acc)}}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(0,0,0,0),0 0 34px var(--acc)}}
/* --- glas & HUD --- */
.glass{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
body:not(.lite) .glass{-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.glass:before,.glass:after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--acc);opacity:.75;pointer-events:none}
.glass:before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:var(--r)}
.glass:after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:var(--r)}
.lbl{font-family:var(--fd);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--acct);display:flex;align-items:center;gap:8px}
.lbl:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),rgba(0,0,0,0))}
.dim{color:var(--dim)}
.big{font-family:var(--fd);font-size:34px;letter-spacing:.03em}
.mono{font-family:var(--fd);letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--txt);font-weight:600;font-size:16px;transition:background .2s,transform .1s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:#02060a;border-color:var(--acc);box-shadow:0 0 16px var(--glow)}
.btn.sm{padding:6px 11px;font-size:14.5px;border-radius:10px}
.btn.bad{color:#ffd2cc;border-color:rgba(255,138,128,.5)}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>input,.row>select{flex:1}
.chip{display:inline-block;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--txt);font-size:15px;font-weight:600;margin:0 6px 6px 0}
.chip.on{background:var(--acc);color:#02060a}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 10px var(--acc);border-radius:8px;transition:width .5s}
/* --- Verkstaden --- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,1.15fr) minmax(0,1fr);gap:16px;padding:6px 22px 18px;min-height:100%;align-content:start}
.dcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{padding:14px 16px;cursor:pointer;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 44px rgba(0,0,0,.55),0 0 0 1px var(--line)}
.card .lbl{margin-bottom:8px}
.card ul{list-style:none;margin:0;padding:0}
.card li{padding:3px 0;display:flex;gap:8px;align-items:baseline;min-width:0}
.card li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card li b{font-family:var(--fd);font-size:13px;color:var(--acct);flex:0 0 auto}
.core{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.reactor{position:relative;width:100%;max-width:440px;aspect-ratio:1/1}
.reactor:before{content:'';display:block;padding-top:100%}
.reactor canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.reactor .ctr{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none}
.reactor .ctr .t{font-family:var(--fd);font-size:13px;letter-spacing:.3em;color:var(--acct)}
.say{margin-top:6px;padding:14px 18px;text-align:center;font-size:19px;min-height:64px;width:100%;max-width:560px}
.say small{display:block;color:var(--dim);font-size:14.5px;margin-top:4px}
.wxrow{display:flex;gap:4px;justify-content:space-between;margin-top:8px}
.wxd{flex:1;text-align:center;font-size:14px;color:var(--dim)}
.wxd b{display:block;color:var(--txt);font-family:var(--fd);font-size:13px}
.wxi{width:26px;height:26px;display:block;margin:2px auto;color:var(--acct)}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
/* --- Samtalet --- */
.talk{display:flex;height:100%;gap:18px;padding:4px 22px 0}
.orbbox{flex:0 0 42%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.orb{position:relative;width:min(36vw,440px);height:min(36vw,440px)}
.orb canvas{width:100%;height:100%}
.ptt{width:96px;height:96px;border-radius:50%;background-color:var(--acc);background-image:radial-gradient(circle,var(--acc),var(--acc2));color:#02060a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px var(--glow),0 0 0 8px rgba(255,255,255,.04);font-family:var(--fd);font-size:12px;letter-spacing:.1em;flex-direction:column;gap:2px}
.ptt svg{width:32px;height:32px}
.ptt.on{-webkit-animation:pulse 1s infinite;animation:pulse 1s infinite}
.state{font-family:var(--fd);letter-spacing:.3em;font-size:13px;color:var(--acct);text-transform:uppercase}
.interim{min-height:24px;color:var(--dim);text-align:center;font-size:17px}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.log{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 4px 10px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 15px;border-radius:16px;font-size:17.5px;-webkit-animation:pop .35s ease;animation:pop .35s ease}
@-webkit-keyframes pop{from{opacity:0;-webkit-transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.msg.u{align-self:flex-end;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-bottom-right-radius:4px}
.msg.j{align-self:flex-start;background:rgba(0,0,0,.55);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.j:before{content:'JARVIS';display:block;font-family:var(--fd);font-size:10.5px;letter-spacing:.25em;color:var(--acct);margin-bottom:3px}
.msg .cardx{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.45);border:1px solid var(--line);font-size:15.5px}
.cardx ul{margin:4px 0 0;padding-left:18px}
.sugg{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.sugg .chip{flex:0 0 auto;margin:0}
/* --- Kommandocentralen --- */
.cc{display:flex;height:100%;gap:16px;padding:4px 22px 16px}
.ccmap{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
#ccsvg{flex:1;width:100%;min-height:260px}
.ccside{flex:0 0 340px;display:flex;flex-direction:column;gap:12px;overflow:auto;padding:14px 16px}
.room .fl{fill:var(--acc);fill-opacity:.08;stroke:var(--acc);stroke-opacity:.7;stroke-width:1.2;transition:fill-opacity .3s}
.room .wl{fill:var(--acc);fill-opacity:.05;stroke:var(--acc);stroke-opacity:.45;stroke-width:1}
.room .tp{fill:none;stroke:var(--acct);stroke-opacity:.55;stroke-width:1;stroke-dasharray:3 4}
.room text{fill:var(--txt);font-family:var(--fb);font-weight:600;font-size:15px;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.85);stroke-width:3px}
.room.sel .fl{fill-opacity:.32}
.room.sel .wl{fill-opacity:.16;stroke-opacity:.9}
.room{cursor:pointer}
.room .al{fill:var(--warn);-webkit-animation:blink 1.2s infinite;animation:blink 1.2s infinite}
@-webkit-keyframes blink{50%{opacity:.2}}
@keyframes blink{50%{opacity:.2}}
.ccgrid line{stroke:var(--acc);stroke-opacity:.12}
.sweep{fill:var(--acc);fill-opacity:.08}
.brief{font-size:17px;line-height:1.45}
/* --- Hologrammet --- */
.holo{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative;overflow:hidden;padding:20px}
.hring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid var(--line);transform:translate(-50%,-50%)}
.hring.a{width:78vmin;height:78vmin;border-style:dashed;-webkit-animation:spin 60s linear infinite;animation:spin 60s linear infinite}
.hring.b{width:62vmin;height:62vmin;border-width:2px;border-color:var(--acc);opacity:.35;border-left-color:rgba(0,0,0,0);border-right-color:rgba(0,0,0,0);-webkit-animation:spin 24s linear infinite reverse;animation:spin 24s linear infinite reverse}
.hring.c{width:92vmin;height:92vmin;opacity:.5;border-top-color:var(--acc);-webkit-animation:spin 90s linear infinite;animation:spin 90s linear infinite}
@-webkit-keyframes spin{to{-webkit-transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hclk{font-family:var(--fd);font-size:min(22vw,180px);line-height:1;letter-spacing:.04em;color:var(--txt);text-shadow:0 0 30px var(--glow),0 0 80px var(--glow);position:relative}
.hdate{font-size:24px;color:var(--acct);letter-spacing:.12em;text-transform:uppercase;margin-top:10px;position:relative;font-weight:600}
.hinfo{margin-top:22px;font-size:21px;color:var(--txt);min-height:60px;max-width:760px;position:relative;transition:opacity .8s}
.hhint{position:absolute;bottom:calc(18px + var(--safeB));left:0;right:0;color:var(--dim);font-size:15px;letter-spacing:.1em}
body.holo-full #rail,body.holo-full #top,body.holo-full #cmd{opacity:0;pointer-events:none}
#rail,#top,#cmd{transition:opacity .6s}
/* --- ark (moduler) --- */
#sheetBg{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
#sheetBg.on{opacity:1;visibility:visible;transition-delay:0s}
#sheet{position:fixed;z-index:21;top:12px;right:12px;bottom:12px;width:min(560px,calc(100vw - 110px));display:flex;flex-direction:column;transform:translateX(110%);transition:transform .45s cubic-bezier(.2,.8,.2,1);background:rgba(6,14,22,.94)}
body.th-mark #sheet{background:rgba(22,8,8,.95)}body.th-natt #sheet{background:rgba(10,8,12,.96)}body.th-smaragd #sheet{background:rgba(4,18,12,.95)}body.th-kvarts #sheet{background:rgba(16,10,28,.95)}
#sheet.on{transform:none}
.sh-h{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sh-h h2{font-family:var(--fd);font-size:18px;letter-spacing:.1em;flex:1;color:var(--txt)}
.sh-h svg.mi{width:26px;height:26px;color:var(--acct)}
.sh-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 18px calc(22px + var(--safeB))}
.sec{margin-bottom:18px}
.sec>.lbl{margin-bottom:10px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);margin-bottom:7px;min-width:0}
.li .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.li .tx small{display:block;color:var(--dim);font-size:14px}
.li.done .tx{color:var(--dim);text-decoration:line-through}
.ck{width:28px;height:28px;flex:0 0 28px;border-radius:8px;border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;color:#02060a}
.ck.on{background:var(--acc)}
.ck svg{width:18px;height:18px}
.x{width:34px;height:34px;flex:0 0 34px;border-radius:9px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.x svg{width:18px;height:18px}
.empty{color:var(--dim);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{text-align:right;font-weight:600}
.disp{font-family:var(--fd);font-size:44px;text-align:center;padding:18px 0;letter-spacing:.04em;text-shadow:0 0 22px var(--glow)}
.ring{display:block;margin:6px auto}
.ring .bgc{stroke:rgba(255,255,255,.08)}
.ring .fgc{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .5s;filter:drop-shadow(0 0 6px var(--acc))}
.ring text{fill:var(--txt);font-family:var(--fd);text-anchor:middle;dominant-baseline:middle}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:13px;color:var(--dim);font-weight:600;padding:4px 0}
.cal .d{padding:7px 0 5px;border-radius:10px;background:rgba(0,0,0,.4);font-weight:600;position:relative;font-size:16px}
.cal .d.o{color:var(--dim);background:transparent;font-weight:500}
.cal .d.red{color:#ffc4bd}
.cal .d.td{box-shadow:inset 0 0 0 2px var(--acc)}
.cal .d.sel{background:var(--acc);color:#02060a}
.cal .d i{position:absolute;left:50%;bottom:2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acct)}
.qr{background:#fff;padding:14px;border-radius:14px;width:260px;margin:8px auto}
.qr svg{display:block;width:100%;height:auto}
.step{font-size:26px;line-height:1.35;padding:18px;text-align:center;min-height:150px;display:flex;align-items:center;justify-content:center}
.breath{position:relative;width:240px;height:240px;margin:16px auto;display:flex;align-items:center;justify-content:center}
.breath .bc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--glow),rgba(0,0,0,0) 70%);border:2px solid var(--acc);box-shadow:0 0 40px var(--glow),inset 0 0 40px var(--glow);transform:scale(.55);transition:transform .1s linear}
.breath .bt{position:relative;font-family:var(--fd);letter-spacing:.12em;font-size:17px;color:var(--txt);text-shadow:0 0 8px #000}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs .chip{flex:0 0 auto;margin:0}
.sw{width:50px;height:30px;flex:0 0 50px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:background .2s}
.sw:after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#dfe9f0;transition:transform .2s}
.sw.on{background:var(--acc)}
.sw.on:after{transform:translateX(20px);background:#fff}

.lwrap{position:relative;width:min(92vmin,700px);height:min(92vmin,700px)}
.lring{position:absolute;left:12%;top:12%;right:12%;bottom:12%;border-radius:50%;border:1px dashed var(--line)}
.lring2{position:absolute;left:30%;top:30%;right:30%;bottom:30%;border-radius:50%;border:2px solid var(--line);box-shadow:0 0 40px var(--glow) inset}
.lcat{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(0,0,0,.65);border:1px solid var(--line);font-weight:600;font-size:15.5px;color:var(--txt);transition:transform .35s cubic-bezier(.2,.8,.2,1),background .2s;transform:scale(.4);opacity:0}

.lcat.on{background:var(--acc);color:#02060a}
.lcat.on svg{color:#02060a}
.lmods{position:absolute;left:31%;top:31%;right:31%;bottom:31%;border-radius:50%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:8px}

.lmod:active{background:rgba(255,255,255,.1)}

#fire{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:20px}

#fire h2{font-family:var(--fd);font-size:26px;letter-spacing:.08em;margin:10px 0;color:var(--txt);text-shadow:0 0 20px var(--glow)}
#fire p{font-size:19px;margin:0 0 20px}
.fico{width:84px;height:84px;margin:0 auto;border-radius:50%;border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;color:var(--acct);-webkit-animation:pulse 1s infinite;animation:pulse 1s infinite}

#toast{position:fixed;left:50%;bottom:calc(96px + var(--safeB));transform:translate(-50%,20px);z-index:50;padding:11px 18px;border-radius:12px;background:rgba(0,0,0,.88);border:1px solid var(--line);color:var(--txt);font-weight:600;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:90vw;text-align:center}

#onb .orb{width:180px;height:180px;margin:0 auto}

.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}

  add(new Date(y,11,31),'Nyårsafton','eve');
  // klämdagar: vardag mellan röd dag och helg
  var reds={};list.forEach(function(x){if(x.t==='red')reds[ymd(x.d)]=1;});
  list.slice().forEach(function(x){if(x.t!=='red')return;var wd=x.d.getDay();
    if(wd===4){var f=addDays(x.d,1);if(!reds[ymd(f)])add(f,'Klämdag','klam',{tip:'Klämdag efter '+x.n.toLowerCase()+'. Ledig? Jag frågar bara.'});}
    if(wd===2){var mo=addDays(x.d,-1);if(!reds[ymd(mo)])add(mo,'Klämdag','klam',{tip:'Klämdag före '+x.n.toLowerCase()+'.'});}});

function calDay(d){

function calUpcoming(days,types){

  return out.sort(function(a,b){return a.d-b.d;});
}

var STORE_KEY='jarvis_app_v1';

var DEMO=params.demo==='1';
function defaultSettings(){return {theme:'isbla',mute:false,rate:1,voiceURI:'',wake:true,wakeWord:'hej jarvis',sounds:true,gfx:'auto',onboarded:false,activeProfile:'',
  city:{name:'Stockholm',lat:59.3293,lon:18.0686},mode:'',waterGoal:2000,wifi:{ssid:'',pass:'',sec:'WPA'},autoNight:true,holoIdle:45,updatedAt:iso()};}

  function load(){if(DEMO){db=blankDB();return;}var raw=null;try{raw=localStorage.getItem(STORE_KEY);}catch(e){}

  function changed(coll){persist();clearTimeout(tmr);tmr=setTimeout(function(){subs.forEach(function(f){try{f(coll);}catch(e){if(window.console)console.error(e);}});},30);}
  function live(c){return (db[c]||[]).filter(function(x){return !x.deleted;});}
  function get(c,id){var a=db[c]||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
  function add(c,o){o=o||{};var t=iso();o.id=o.id||uid();o.createdAt=o.createdAt||t;o.updatedAt=t;o.deleted=false;if(!o.by&&db.settings.activeProfile)o.by=db.settings.activeProfile;db[c].push(o);changed(c);return o;}

  function restore(c,id){var o=get(c,id);if(!o)return null;o.deleted=false;o.updatedAt=iso();changed(c);return o;}
  function purge(){var cut=nowMs()-90*864e5;COLLS.forEach(function(c){db[c]=db[c].filter(function(x){return !x.deleted||Date.parse(x.updatedAt)>cut;});});}
  function setting(k){return db.settings[k];}
  function set(k,v){db.settings[k]=v;db.settings.updatedAt=iso();changed('settings');}

  function importJSON(txt,mode){var o;try{o=JSON.parse(txt);}catch(e){return {ok:false,msg:'Filen är inte giltig JSON.'};}
    var d=o&&o.data?o.data:o;if(!d||d.app!=='jarvis')return {ok:false,msg:'Det här ser inte ut som en Jarvis-export.'};

    d=migrate(d);var n=0;
    if(mode==='replace'){db=d;n=COLLS.reduce(function(s,c){return s+d[c].length;},0);}

  function seed(d){db=d;changed('all');}
  load();
  return {all:live,raw:function(c){return db[c];},get:get,add:add,update:update,remove:remove,restore:restore,setting:setting,set:set,settings:function(){return db.settings;},
    log:log,logs:function(){return db.log;},on:function(f){subs.push(f);},exportJSON:exportJSON,importJSON:importJSON,size:size,reset:reset,seed:seed,db:function(){return db;},demo:DEMO,key:STORE_KEY};
})();

function calcExpr(s){var i=0;s=s.replace(/\s+/g,'');
  function num(){var m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)throw 'tal';i+=m[0].length;return +m[0];}
  function factor(){if(s[i]==='-'){i++;return -factor();}if(s[i]==='+'){i++;return factor();}if(s[i]==='('){i++;var v=expr();if(s[i]!==')')throw 'parentes';i++;return v;}if(s.substr(i,4)==='sqrt'){i+=4;return Math.sqrt(factor());}return num();}
  function power(){var b=factor();if(s[i]==='^'){i++;return Math.pow(b,power());}return b;}
  function term(){var v=power();while(s[i]==='*'||s[i]==='/'){var o=s[i++],r=power();v=o==='*'?v*r:v/r;}return v;}
  function expr(){var v=term();while(s[i]==='+'||s[i]==='-'){var o=s[i++],r=term();v=o==='+'?v+r:v-r;}return v;}
  var v=expr();if(i<s.length)throw 'rest';return v;}

  .replace(/ (gånger|multiplicerat med|x|×) /g,'*').replace(/ (delat med|delat på|dividerat med|genom|÷) /g,'/').replace(/ plus /g,'+').replace(/ minus /g,'-').replace(/(\d)\s*%/g,'($1/100)').replace(/ procent/g,'/100');

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

  if(a.module){if(a.module==='help'||a.module==='brief'||MODE==='holo'||!isPhone()||a.cmd||a.value)openModule(a.module,a.value);else{toastOpen(a.module);}}
  if(a.brief)openModule('brief');
  var c=a.cmd;if(!c)return;
  if(c==='stop'){Voice.stop();setState('idle');}else if(c==='close'){closeSheet();closeLauncher();}else if(c==='theme'||c==='gfx')applySettings();else if(c==='sleep'){setTimeout(function(){setMode('holo');},2500);}
  else if(c==='memoRec')setTimeout(function(){ACT.memoStart();},400);else if(c==='memoPlay')ACT.memoPlay({getAttribute:function(){return a.value;}});else if(c==='export')ACT.exportFile();else if(c==='breath')setTimeout(function(){ACT.breathStart();},300);
  else if(c==='profile'){updateTop();VIEWS[MODE].show();}else if(c==='wake'){if(Store.setting('wake'))wakeStart();else wakeStop();}}
function toastOpen(mod){var e=$('#toast');e.innerHTML='';toast('Tryck för att öppna '+MODS[mod].title.toLowerCase(),3000);e.style.pointerEvents='auto';e.onclick=function(){openModule(mod);e.className='';e.style.pointerEvents='none';};setTimeout(function(){e.style.pointerEvents='none';},3000);}

  var cls=['th-'+th];if(lite)cls.push('lite');if(MODE==='holo')cls.push('holo-full');document.body.className=cls.join(' ');
  setTimeout(function(){REACT.forEach(function(r){r.colors();});Fx.redraw();},30);var mt=$('meta[name="theme-color"]');if(mt)mt.setAttribute('content',getComputedStyle(document.body).getPropertyValue('--bg').trim());}

function bindEvents(){
  document.addEventListener('click',function(e){var t=e.target,el;LAST_INPUT=nowMs();Sfx.unlock();Voice.unlock();
    if((el=t.closest('[data-mode]'))){setMode(el.getAttribute('data-mode'));return;}
    if((el=t.closest('[data-mod]'))){openModule(el.getAttribute('data-mod'),el.getAttribute('data-val')||undefined);return;}
    if((el=t.closest('[data-say]'))){send(el.getAttribute('data-say'));return;}
    if((el=t.closest('[data-act]'))){var f=ACT[el.getAttribute('data-act')];if(f){f(el,e);}return;}});
  document.addEventListener('submit',function(e){e.preventDefault();var f=e.target;if(f.id==='cmd'){var i=$('#inp');var v=i.value;i.value='';send(v);return;}var fn=FORM[f.getAttribute('data-form')];if(fn){var fid=f.getAttribute('data-form');fn(f);Sfx.play('ok');if(CUR&&$('#shB').contains(f)){renderSheet();var nf=$('#shB [data-form="'+fid+'"] input');if(nf&&!isPhone())nf.focus();}}});
  document.addEventListener('change',function(e){var el=e.target.closest('[data-chg]');if(el&&CHG[el.getAttribute('data-chg')])CHG[el.getAttribute('data-chg')](el);});
  document.addEventListener('keydown',function(e){LAST_INPUT=nowMs();if(e.key==='Escape'){if($('#fire').className!=='hide')fireDone();else if(CUR)closeSheet();else closeLauncher();}});
  $('#sheetBg').addEventListener('click',closeSheet);$('#micBtn').addEventListener('click',function(){listenOnce();});
  window.addEventListener('online',updateTop);window.addEventListener('offline',updateTop);
  window.addEventListener('resize',function(){clearTimeout(bindEvents.rt);bindEvents.rt=setTimeout(function(){if(VIEWS[MODE])VIEWS[MODE].show();if($('#launch').className==='on')renderLauncher();},150);});
  document.addEventListener('visibilitychange',function(){if(!document.hidden){Engine.tick();updateTop();}});}

/* ===== Introduktion (röststyrd) ===== */
var Onboard=(function(){var step=0,D={name:'',title:'',others:'',city:null,theme:'isbla'},R=null,box=null,STEPS=6;
  function q(){return [
    ['JARVIS','God dag. Jag är Jarvis – er nya, mycket väluppfostrade assistent. Ska vi bekanta oss? Det tar en minut.',''],
    ['VEM ÄR DU?','Först: vad heter du?','name'],
    ['TILLTAL','Hur vill du att jag tilltalar dig, '+D.name+'?','title'],
    ['HUSHÅLLET','Bor det fler här? Säg deras namn, eller "nej".','others'],
    ['PLATS','Vilken stad bor ni i? Jag behöver det för vädret.','city'],
    ['UTSEENDE','Välj ett tema. Det går att byta när som helst.','theme'],
    ['KLART','Utmärkt, '+(D.title||D.name)+'. Allt är på plats. Säg "hjälp" om du undrar något – eller fråga bara.','']][step];}
  function render(){var s=q(),h='<div class="glass"><canvas class="orb" id="cvOnb" width="360" height="360"></canvas><h1>'+s[0]+'</h1><p id="onbQ">'+esc(s[1])+'</p>';
    if(s[2]==='name')h+='<form data-form="onbNext"><input name="v" value="'+esc(D.name)+'" placeholder="Ditt förnamn" aria-label="Namn" autocomplete="given-name"></form>';
    if(s[2]==='title')h+='<div style="margin-bottom:12px">'+['sir','chefen','madame',D.name].map(function(t){return '<button class="chip'+(D.title===t?' on':'')+'" data-act="onbPick" data-v="'+esc(t)+'">'+esc(cap(t))+'</button>';}).join('')+'</div><form data-form="onbNext"><input name="v" value="'+esc(D.title)+'" placeholder="…eller skriv eget" aria-label="Tilltal"></form>';
    if(s[2]==='others')h+='<form data-form="onbNext"><input name="v" value="'+esc(D.others)+'" placeholder="T.ex. Anna, Elsa (valfritt)" aria-label="Fler i hushållet"></form>';
    if(s[2]==='city')h+='<form data-form="onbNext"><input name="v" value="'+esc(D.city?D.city.name:'')+'" placeholder="T.ex. Göteborg" aria-label="Stad"></form>';
    if(s[2]==='theme')h+='<div class="thm" style="justify-content:center;margin-bottom:12px">'+Object.keys(THEME_NAMES).map(function(t){return '<button class="'+(D.theme===t?'on':'')+'" data-act="onbTheme" data-id="'+t+'"><i style="background:radial-gradient(circle at 35% 35%,'+THEME_SW[t][0]+','+THEME_SW[t][1]+')"></i>'+THEME_NAMES[t]+'</button>';}).join('')+'</div>';
    h+='<div class="row" style="justify-content:center">'+(s[2]&&s[2]!=='theme'&&Voice.canListen()?'<button class="btn" data-act="onbMic">'+icon('mic')+'Svara med rösten</button>':'')+(step===0?'<button class="btn pri" data-act="onbGo">'+icon('play')+'Starta</button><button class="btn sm" data-act="onbSkip">Hoppa över</button>':step===STEPS?'<button class="btn pri" data-act="onbDone">Kör igång</button>':'<button class="btn pri" data-act="onbNextB">Nästa'+icon('next')+'</button>')+'</div>';
    h+='<div class="dots">';for(var i=0;i<=STEPS;i++)h+='<i class="'+(i<=step?'on':'')+'"></i>';h+='</div></div>';box.innerHTML=h;
    R=Reactor($('#cvOnb'));R.set('speak');var inp=box.querySelector('input');if(inp&&!isPhone())setTimeout(function(){inp.focus();},50);}
  function ask(){var s=q();render();speak(s[1],function(){R&&R.set('idle');if(s[2]&&s[2]!=='theme'&&Voice.canListen()&&!window.__noVoice&&Store.setting('onbVoice'))mic();});}
  function mic(){if(!Voice.canListen())return;R.set('listen');Sfx.play('listen');Voice.listen({oninterim:function(t){var i=box.querySelector('input');if(i)i.value=t;},onfinal:function(t){answer(t);},onerror:function(){R&&R.set('idle');},onend:function(){R&&R.set('idle');}});}
  function clean(t){return trim(String(t||'').replace(/^(jag heter|mitt namn är|det är|jag är|vi bor i|i|kalla mig|tilltala mig som|de heter|det bor)\s+/i,'').replace(/[.!?]+$/,''));}
  function answer(v){var s=q()[2];v=clean(v);if(s==='name'){if(!v){toast('Skriv ditt namn.');return;}D.name=cap(v.split(' ')[0]);if(!D.title)D.title='';}
    else if(s==='title'){D.title=v||'sir';}
    else if(s==='others'){D.others=/^(nej|ingen|inga|bara jag|nope)$/i.test(v)?'':v;}
    else if(s==='city'){if(!v){D.city=Store.setting('city');next();return;}toast('Söker '+v+' …');Weather.lookupCity(v,function(o){if(!o){speak('Jag hittade inte '+v+'. Försök igen, eller tryck Nästa för Stockholm.');D.city=null;return;}D.city=o;next();});return;}
    next();}
  function next(){step=Math.min(STEPS,step+1);ask();}
  function finish(){var ps=Store.all('profiles');ps.forEach(function(p){Store.remove('profiles',p.id);});var me=Store.add('profiles',{name:D.name||'Du',title:D.title||'sir',greeting:'',color:''});
    splitList(D.others).forEach(function(n){n=cap(trim(n));if(n&&n.toLowerCase()!==me.name.toLowerCase())Store.add('profiles',{name:n,title:n,greeting:'',color:''});});
    Store.set('activeProfile',me.id);if(D.city)Store.set('city',D.city);Store.set('theme',D.theme);Store.set('onboarded',true);ensureRooms();close();Weather.refresh(true,function(){updateTop();if(VIEWS[MODE].update)VIEWS[MODE].update();});
    applySettings();updateTop();var m=isPhone()?'samtal':'verkstad';MODE='';setMode(m);speak(briefing(now().getHours()>=17?'evening':'morning'));}
  function close(){Voice.stopListen();if(box){box.parentNode.removeChild(box);box=null;}R=null;}
  ACT.onbGo=function(){Sfx.unlock();Voice.unlock();Store.set('onbVoice',true);Sfx.play('boot');next();};ACT.onbSkip=function(){D.name=D.name||'Du';finish();};
  ACT.onbNextB=function(){var i=box.querySelector('input');if(q()[2]==='theme'){next();return;}answer(i?i.value:'');};FORM.onbNext=function(f){answer(fv(f,'v'));};
  ACT.onbPick=function(el){D.title=el.getAttribute('data-v');next();};ACT.onbTheme=function(el){D.theme=idOf(el);Store.set('theme',D.theme);Store.set('autoNight',false);applySettings();render();};
  ACT.onbMic=function(){mic();};ACT.onbDone=function(){finish();};
  return {start:function(force){if(box)return;var p=profile();step=0;D={name:force&&p?p.name:'',title:force&&p?p.title:'',others:'',city:Store.setting('city'),theme:Store.setting('theme')||'isbla'};box=h('div','',' ');box.id='onb';document.body.appendChild(box);render();if(force)speak(q()[1]);},
    active:function(){return !!box;},answer:answer,step:function(){return step;}};})();

  var a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(nowMs()-LAST_INPUT>s*1000)setMode('holo');}
